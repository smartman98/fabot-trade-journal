<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 매매 일지</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" style="max-width:360px;">
    <h1>로그인</h1>
    <p class="sub">계좌 잔고·매매 기록은 로그인 후에만 볼 수 있습니다.</p>

    <form id="login-form" class="trade-form" style="grid-template-columns:1fr;">
      <label class="full">아이디 <input type="text" id="l-username" autocomplete="username" required /></label>
      <label class="full">비밀번호 <input type="password" id="l-password" autocomplete="current-password" required /></label>
      <div class="form-actions">
        <button type="submit" class="primary-btn">로그인</button>
        <a href="index.html" class="ghost-btn" style="text-decoration:none;">← 게스트로 보기</a>
      </div>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("login-error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      const username = document.getElementById("l-username").value;
      const password = document.getElementById("l-password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        errorEl.textContent = err.error || "로그인에 실패했습니다.";
        return;
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
