<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매매 일지 (모의투자)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>매매 일지 (모의투자)</h1>
    <p>
      <a href="https://fabot-daily-briefing-agent.onrender.com/" target="_blank" rel="noopener">🤖 데일리 브리핑 보기 →</a>
      &nbsp;&nbsp;
      <button class="workflow-toggle" id="workflow-toggle">FABOT System 보기</button>
    </p>
    <div class="workflow-wrap" id="workflow-wrap" hidden>
      <svg viewBox="0 0 680 630" width="100%" style="max-width:640px;display:block;margin:0 auto;">
        <title>FABOT 자동매매 시스템 워크플로</title>
        <defs><marker id="wfArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

        <rect x="240" y="40" width="200" height="44" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">FABOT SYSTEM</text>

        <path d="M340 84 L340 116" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>

        <rect x="230" y="116" width="220" height="56" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">실행 창 확인</text>
        <text x="340" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">매매 가능한 시간대인지</text>

        <path d="M450 144 L565 144 L565 196" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>
        <text x="507" y="132" text-anchor="middle" font-size="11" fill="#52514e">매매불가능시간</text>
        <rect x="490" y="196" width="150" height="44" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="565" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">실행 중단</text>

        <path d="M340 172 L340 216" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>
        <text x="352" y="196" font-size="11" fill="#52514e">매매가능시간</text>

        <rect x="240" y="216" width="200" height="44" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">F&amp;G·대기기간 조회</text>

        <path d="M340 260 L340 308" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>

        <rect x="240" y="308" width="200" height="56" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="340" y="326" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">매매 판단</text>
        <text x="340" y="344" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">F&amp;G 임계값 비교</text>

        <path d="M340 364 L340 386 L140 386 L140 408" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>
        <path d="M340 364 L340 408" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>
        <path d="M340 364 L340 386 L540 386 L540 408" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>

        <rect x="50" y="408" width="180" height="56" rx="8" fill="#e3f6ee" stroke="#1baf7a"/>
        <text x="140" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">매수 주문</text>
        <text x="140" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">키움/KIS 주문</text>

        <rect x="250" y="408" width="180" height="56" rx="8" fill="#e3f6ee" stroke="#1baf7a"/>
        <text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">매도 주문</text>
        <text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">보유분 매도</text>

        <rect x="450" y="408" width="180" height="56" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="540" y="426" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">관망</text>
        <text x="540" y="444" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">주문 없음</text>

        <path d="M140 464 L140 494 L300 494 L300 524" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>
        <path d="M340 464 L340 524" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#wfArrow)"/>

        <rect x="140" y="524" width="400" height="56" rx="8" fill="#f0efec" stroke="#c9c8c0"/>
        <text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0b0b0b">기록 저장 + 알림</text>
        <text x="340" y="560" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#52514e">Supabase trades + 텔레그램</text>

        <text x="340" y="604" text-anchor="middle" font-size="11" fill="#52514e">↻ 다음 스케줄에 반복</text>
      </svg>
    </div>

    <section id="signal-section">
      <div class="signal-grid">
        <div class="signal-col">
          <div id="signal-banner" class="signal-banner" hidden></div>
        </div>
        <div class="chart-col">
          <div class="chart-card">
            <p class="chart-title">F&G 지수 추이</p>
            <div class="filter-row" id="filter-row">
              <button class="filter-btn" data-range="30">최근 30일</button>
              <button class="filter-btn active" data-range="90">최근 90일</button>
              <button class="filter-btn" data-range="365">최근 1년</button>
              <button class="filter-btn" data-range="all">전체</button>
            </div>
            <div style="position:relative;">
              <svg class="fg-chart" id="chart" viewBox="0 0 640 260" role="img" aria-label="F&G 지수 추이 차트"></svg>
              <div class="tooltip" id="tooltip"></div>
            </div>
            <button class="table-toggle" id="table-toggle">표로 보기</button>
            <div class="table-wrap" id="table-wrap" hidden>
              <table>
                <thead><tr><th>날짜</th><th>F&G 점수</th></tr></thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </section>

    <hr class="section-divider" />

    <!-- 계좌 잔고 (모의투자) -->
    <section id="balance-section">
      <div id="balance-sections"></div>
    </section>

    <hr class="section-divider" />

    <!-- 목록 화면: 계좌에 안 묶인(기타) 매매기록만 여기 남는다. 계좌별 매매기록은
         계좌 잔고 블록 안에 같이 나온다. -->
    <section id="list-view" hidden>
      <div class="list-header">
        <h2>매매 기록 (기타 계좌)</h2>
      </div>
      <div id="loading" class="muted">불러오는 중…</div>
      <ul id="trade-list" class="trade-list"></ul>
    </section>

    <!-- 입력/수정 폼 화면 -->
    <section id="form-view" hidden>
      <h2 id="form-title">새 매매 기록</h2>
      <form id="trade-form" class="trade-form">
        <label>매매 날짜 <input type="date" id="f-date" required /></label>
        <label>종목 <input type="text" id="f-ticker" required /></label>
        <label>구분
          <select id="f-action" required>
            <option value="buy">매수</option>
            <option value="sell">매도</option>
            <option value="dividend">배당</option>
          </select>
        </label>
        <label id="f-quantity-label">수량 <input type="number" id="f-quantity" min="0" step="any" required /></label>
        <label id="f-price-label">주가 <input type="number" id="f-price" min="0" step="any" required /></label>
        <label>그때 F&G 점수 (선택) <input type="number" id="f-fg" min="0" max="100" step="0.01" /></label>
        <label>계좌 (선택)
          <select id="f-account">
            <option value="">선택 안 함</option>
            <option value="키움 실전투자">키움 실전투자</option>
            <option value="키움 모의투자">키움 모의투자</option>
            <option value="KIS 모의투자">KIS 모의투자</option>
            <option value="__custom__">기타 (직접입력)</option>
          </select>
        </label>
        <label class="full" id="f-account-custom-wrap" hidden>계좌 직접입력 <input type="text" id="f-account-custom" /></label>
        <label class="full">메모 (선택) <textarea id="f-memo" rows="3"></textarea></label>

        <div class="form-actions">
          <button type="submit" class="primary-btn">저장</button>
          <button type="button" id="cancel-btn" class="ghost-btn">취소</button>
        </div>
        <p id="form-error" class="error"></p>
      </form>
    </section>

    <!-- 상세 화면 -->
    <section id="detail-view" hidden>
      <h2>기록 상세</h2>
      <div id="detail-body" class="detail-body"></div>
      <div class="form-actions">
        <button id="detail-edit-btn" class="primary-btn">수정</button>
        <button id="detail-delete-btn" class="danger-btn">삭제</button>
        <button id="detail-back-btn" class="ghost-btn">목록으로</button>
      </div>
    </section>
  </div>

  <!-- 배당 기록 추가용 모달(별도 창) — 계좌 잔고 블록의 "+ 배당 기록 추가" 버튼이 이걸 연다 -->
  <div id="dividend-modal-overlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3 id="dividend-modal-title">배당 기록 추가</h3>
      <form id="dividend-form">
        <label>날짜 <input type="date" id="dm-date" required /></label>
        <label>종목 <input type="text" id="dm-ticker" required /></label>
        <label>세후 수령액 <input type="number" id="dm-amount" min="0" step="any" required /></label>
        <label class="full">메모 (선택) <textarea id="dm-memo" rows="2"></textarea></label>
        <div class="form-actions">
          <button type="submit" class="primary-btn">저장</button>
          <button type="button" id="dm-cancel-btn" class="ghost-btn">취소</button>
        </div>
        <p id="dm-error" class="error"></p>
      </form>
    </div>
  </div>

  <script src="fg_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
